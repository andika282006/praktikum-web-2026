<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Portfolio Tracker - Sunset & Cream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    body { 
      background-color: #FFF8E7; 
      color: #4A2C2A; 
      padding: 30px 15px; 
      font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      background: #FFFDF9;
      border-radius: 16px; 
      padding: 28px; 
      border: 2px solid transparent;
      background-image: linear-gradient(#FFFDF9, #FFFDF9), linear-gradient(135deg, #ff5e78, #ff8c42, #ffd56b);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 10px 30px rgba(200, 75, 49, 0.15); 
    }
    h1 { 
      font-family: 'Playfair Display', serif;
      background: linear-gradient(90deg, #c84b31, #ff5e78, #ff8c42);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 28px; 
      margin-bottom: 5px; 
      letter-spacing: 0.5px;
    }
    p.subtitle { 
      color: #8A5A44; 
      margin-bottom: 22px; 
      font-size: 13px; 
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
      margin-bottom: 25px; 
    }
    .stat-card { 
      background: #FFFDF9;
      border: 1.5px solid #ff8c42;
      border-radius: 10px; 
      padding: 16px; 
      text-align: center; 
      transition: transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 4px 10px rgba(255, 140, 66, 0.08);
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 94, 120, 0.2);
      border-color: #ff5e78;
    }
    .stat-card h3 { 
      font-size: 11px; 
      color: #8A5A44; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      margin-bottom: 6px; 
      font-weight: 600;
    }
    .stat-card p { 
      font-size: 19px; 
      font-weight: 700; 
      background: linear-gradient(90deg, #c84b31, #ff5e78);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .form-card { 
      background: #FFFDF9;
      border: 1.5px solid #ffd56b; 
      border-radius: 10px; 
      padding: 20px; 
      margin-bottom: 25px; 
    }
    .form-card h2 {
      font-size: 15px;
      color: #c84b31;
      margin-bottom: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .form-group { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      margin-bottom: 12px; 
    }
    .form-control { 
      flex: 1; 
      min-width: 180px; 
      padding: 9px 12px; 
      background: #FFF8E7; 
      border: 1.5px solid #ffb26b; 
      border-radius: 6px; 
      color: #4A2C2A; 
      font-size: 13px; 
      outline: none;
      font-family: 'Poppins', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      
      appearance: none; 
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c84b31' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 30px;
      cursor: pointer;
    }
    .form-control::placeholder {
      color: #a88375;
    }
    .form-control:focus {
      border-color: #ff5e78;
      box-shadow: 0 0 0 3px rgba(255, 94, 120, 0.15);
    }

    /* =========================================
       TRIK JITU MEMBUNUH WARNA BIRU BAWAAN OS 
       ========================================= */
    .form-control option {
      background-color: #FFF8E7; 
      color: #4A2C2A; 
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      padding: 10px;
    }

    /* Menutupi warna biru dengan box-shadow inset (warna kuning/oranye) */
    .form-control option:hover,
    .form-control option:focus {
      box-shadow: 0 0 10px 100px #ff8c42 inset !important;
      color: #ffffff !important; 
      background-color: #ff8c42 !important;
    }

    /* Saat sedang dipilih (selected), warnanya jadi pink sunset */
    .form-control option:checked {
      background-color: #ff5e78 !important;
      color: #ffffff !important;
      box-shadow: 0 0 10px 100px #ff5e78 inset !important;
    }
    /* ========================================= */

    .form-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .checkbox-group { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 13px; 
      color: #8A5A44; 
      cursor: pointer;
      font-weight: 500;
    }
    .checkbox-group input {
      accent-color: #ff5e78;
    }
    .btn-submit { 
      padding: 9px 18px; 
      background: linear-gradient(135deg, #ff8c42, #ff5e78);
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 13px; 
      font-family: 'Poppins', sans-serif;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(255, 94, 120, 0.25);
    }
    .btn-submit:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 94, 120, 0.4);
    }

    .controls-wrapper { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
    }
    .search-input { 
      padding: 9px 12px; 
      background: #FFFDF9;
      border: 1.5px solid #ffb26b;
      border-radius: 6px; 
      color: #4A2C2A; 
      width: 220px; 
      font-size: 13px; 
      outline: none;
      font-family: 'Poppins', sans-serif;
    }
    .search-input::placeholder {
      color: #a88375;
    }
    .search-input:focus {
      border-color: #ff5e78;
      box-shadow: 0 0 0 3px rgba(255, 94, 120, 0.15);
    }
    .filter-group { 
      display: flex; 
      gap: 6px; 
      flex-wrap: wrap; 
    }
    .btn-filter { 
      padding: 6px 12px; 
      border: 1.5px solid #ffb26b;
      background: #FFFDF9;
      color: #8A5A44; 
      border-radius: 20px; 
      cursor: pointer; 
      font-size: 12px; 
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-filter.active, .btn-filter:hover { 
      background: linear-gradient(135deg, #ff8c42, #ff5e78);
      color: #fff; 
      font-weight: 600; 
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 94, 120, 0.25);
    }

    .project-card { 
      border: 1.5px solid #ffd56b;
      border-radius: 10px; 
      padding: 16px; 
      margin-bottom: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #FFFDF9;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .project-card:hover {
      transform: translateX(3px);
      border-color: #ff8c42;
      box-shadow: 0 4px 12px rgba(255, 140, 66, 0.15);
    }
    .project-info h4 { 
      font-size: 15px; 
      color: #4A2C2A; 
      margin-bottom: 5px; 
      font-weight: 600;
    }
    .project-category { 
      display: inline-block; 
      font-size: 11px; 
      color: #c84b31; 
      background: rgba(255, 140, 66, 0.15);
      padding: 2px 8px; 
      border-radius: 12px; 
      margin-bottom: 5px; 
      font-weight: 600;
    }
    .project-budget { 
      font-size: 13px; 
      color: #8A5A44; 
      font-weight: 500;
    }
    .badge { 
      padding: 3px 10px; 
      border-radius: 12px; 
      font-size: 11px; 
      font-weight: 600; 
    }
    .badge-success { 
      background: rgba(34, 197, 94, 0.15);
      color: #15803d; 
    }
    .badge-pending { 
      background: rgba(255, 140, 66, 0.2);
      color: #c84b31; 
    }

    .card-actions { 
      display: flex; 
      gap: 6px; 
      align-items: center; 
    }
    .btn-action { 
      padding: 6px 11px; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: 600; 
      font-family: 'Poppins', sans-serif;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-toggle { 
      background: rgba(255, 140, 66, 0.2);
      color: #c84b31; 
      border: 1px solid rgba(255, 140, 66, 0.4);
    }
    .btn-toggle:hover {
      background: rgba(255, 140, 66, 0.3);
    }
    .btn-delete { 
      background: rgba(239, 68, 68, 0.1); 
      color: #dc2626; 
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-delete:hover { 
      background: #ef4444; 
      color: white; 
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Portfolio Tracker</h1>
    <p class="subtitle">Tugas Mandiri Modul 4 - Pembangunan Portofolio Interaktif</p>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Proyek</h3>
        <p id="stat-total-projects">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Anggaran</h3>
        <p id="stat-total-budget">Rp 0</p>
      </div>
      <div class="stat-card">
        <h3>Selesai Dikerjakan</h3>
        <p id="stat-completed-projects">0</p>
      </div>
    </div>

    <div class="form-card">
      <h2>+ Tambah Proyek Baru</h2>
      <form id="project-form">
        <div class="form-group">
          <input type="text" id="input-title" class="form-control" placeholder="Judul Proyek" required>
          <select id="input-category" class="form-control">
            <option value="Web App">Web App</option>
            <option value="Mobile App">Mobile App</option>
            <option value="Desktop App">Desktop App</option>
            <option value="UI/UX Design">UI/UX Design</option>
          </select>
          <input type="number" id="input-budget" class="form-control" placeholder="Estimasi Anggaran (Rp)" required min="1">
        </div>
        <div class="form-row-bottom">
          <label class="checkbox-group">
            <input type="checkbox" id="input-completed"> Sudah Selesai
          </label>
          <button type="submit" class="btn-submit">Tambah Proyek</button>
        </div>
      </form>
    </div>

    <div class="controls-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="Cari nama proyek...">
      <div class="filter-group">
        <button class="btn-filter active" data-category="Semua">Semua</button>
        <button class="btn-filter" data-category="Web App">Web App</button>
        <button class="btn-filter" data-category="Mobile App">Mobile App</button>
        <button class="btn-filter" data-category="Desktop App">Desktop App</button>
        <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
      </div>
    </div>

    <div id="project-list"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
