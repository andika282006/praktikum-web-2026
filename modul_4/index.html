<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Portofolio Proyek - Modul 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 30px 15px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
    
    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; text-align: center; }
    .stat-card h3 { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card p { font-size: 18px; font-weight: bold; color: #38bdf8; }

    /* Form Input Dinamis (Tugas Mandiri Fitur 1) */
    .form-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .form-control { flex: 1; min-width: 180px; padding: 8px 12px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; }
    .btn-submit { padding: 8px 16px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-submit:hover { background: #0369a1; }

    /* Controls: Search & Filter (Tugas Mandiri Fitur 2) */
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input { padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; width: 220px; font-size: 13px; }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-filter { padding: 6px 12px; border: 1px solid #475569; background: #0f172a; color: #94a3b8; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-filter.active, .btn-filter:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }

    /* Project Card & Action Buttons (Tugas Mandiri Fitur 3) */
    .project-card { border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #0f172a; }
    .project-info h4 { font-size: 15px; color: #f8fafc; margin-bottom: 4px; }
    .project-category { display: inline-block; font-size: 11px; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
    .project-budget { font-size: 13px; color: #cbd5e1; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge-pending { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .card-actions { display: flex; gap: 6px; align-items: center; }
    .btn-action { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .btn-toggle { background: #334155; color: #f8fafc; }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .btn-delete:hover { background: #ef4444; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portofolio Proyek</h1>
    <p class="subtitle">Modul 4: Pengolahan Logika Data & Interaktivitas DOM</p>

    <!-- Kartu Ringkasan Statistik -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Proyek</h3>
        <p id="stat-total-projects">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Anggaran</h3>
        <p id="stat-total-budget">Rp 0</p>
      </div>
      <div class="stat-card">
        <h3>Selesai Dikerjakan</h3>
        <p id="stat-completed-projects">0</p>
      </div>
    </div>

    <!-- Fitur 1: Form Input Proyek Dinamis -->
    <div class="form-card">
      <form id="project-form">
        <div class="form-group">
          <input type="text" id="input-title" class="form-control" placeholder="Judul Proyek" required>
          <select id="input-category" class="form-control">
            <option value="Web App">Web App</option>
            <option value="Mobile App">Mobile App</option>
            <option value="Desktop App">Desktop App</option>
            <option value="UI/UX Design">UI/UX Design</option>
          </select>
          <input type="number" id="input-budget" class="form-control" placeholder="Anggaran (Rp)" required min="1">
        </div>
        <div class="form-group" style="justify-content: space-between;">
          <label class="checkbox-group">
            <input type="checkbox" id="input-completed"> Sudah Selesai
          </label>
          <button type="submit" class="btn-submit">+ Tambah Proyek</button>
        </div>
      </form>
    </div>

    <!-- Fitur 2: Pencarian & Filter Kategori -->
    <div class="controls">
      <input type="text" id="search-input" class="search-input" placeholder="Cari nama proyek...">
      <div class="filter-group">
        <button class="btn-filter active" data-category="Semua">Semua Proyek</button>
        <button class="btn-filter" data-category="Web App">Web App</button>
        <button class="btn-filter" data-category="Mobile App">Mobile App</button>
        <button class="btn-filter" data-category="Desktop App">Desktop App</button>
        <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
      </div>
    </div>

    <!-- Kontainer Daftar Proyek -->
    <div id="project-list"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
